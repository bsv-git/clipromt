name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o bin/clipromt ./cmd/clipromt
      - run: bash tests/bash-integration.sh
      - run: go test ./internal/composer -run '^$' -fuzz FuzzSuggest -fuzztime 10s
